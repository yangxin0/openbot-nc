  relay-desktop-e2e:
    name: Central relay desktop E2E
    needs: detect
    if: needs.detect.outputs.remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - parallel:
          - name: Set up Bun
            uses: ./.github/actions/setup-bun

          - name: Install a virtual display
            shell: bash
            run: |
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes xvfb

      - name: Run the relay desktop app E2E test
        run: xvfb-run -a bun run test:relay-app

      - name: Run the relay Team settings E2E test
        if: ${{ !cancelled() }}
        run: xvfb-run -a bun run test:relay-team-ui

      - name: Upload the relay desktop E2E reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-desktop-e2e
          path: |
            .openbot-build/relay-app-e2e/
            .openbot-build/relay-team-ui-e2e/
          if-no-files-found: ignore

  all-checks-pass:
    name: All required checks pass
    if: always()
    needs: [detect, check, browser, tests-desktop, automation-cli-e2e, team-api-routes-e2e, reverse-actions-e2e, provider-fakes-e2e, surfaces, relay-e2e, relay-desktop-e2e, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on a failed or cancelled job
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A required job ended as $result." >&2
                exit 1
                ;;
            esac
          done
