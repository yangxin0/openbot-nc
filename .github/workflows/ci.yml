  surfaces:
    name: Surfaces
    needs: detect
    if: needs.detect.outputs.surfaces == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - parallel:
          - name: Typecheck mobile
            run: bun run mobile:typecheck

          - name: Typecheck team client
            run: bun run typecheck:team-client

      - parallel:
          - name: Typecheck the central relay server
            run: bun run typecheck:remote

          - name: Typecheck browser extension
            run: bun run typecheck:extension

      - name: Build browser extension
        run: bun run --cwd apps/browser-extension build

      - parallel:
          - name: Typecheck logging
            run: bun run typecheck:logging

          - name: Typecheck telemetry
            run: bun run typecheck:telemetry

          - name: Typecheck user errors
            run: bun run typecheck:user-errors

          - name: Typecheck i18n
            run: bun run typecheck:i18n

  storybook:
    name: Storybook build
    needs: detect
    if: needs.detect.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
