name: openbot-relay

services:
  relay:
    build:
      context: ..
      dockerfile: remote/api/Dockerfile
      args:
        OPENBOT_SOURCE_COMMIT: ${OPENBOT_SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: 8443
      RELAY_HEALTH_HOST: 0.0.0.0
      RELAY_HEALTH_PORT: 8080
      RELAY_DATA_DIR: /data
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:?RELAY_PUBLIC_URL is required}
      RELAY_TLS_DISABLED: ${RELAY_TLS_DISABLED:-false}
      RELAY_TLS_CLIENT_CERTIFICATES: ${RELAY_TLS_CLIENT_CERTIFICATES:-off}
      RELAY_CA_PASSPHRASE: ${RELAY_CA_PASSPHRASE:-}
      RELAY_METRICS_TOKEN: ${RELAY_METRICS_TOKEN:-}
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-false}
      RELAY_MAX_SOCKETS_PER_IP: ${RELAY_MAX_SOCKETS_PER_IP:-128}
      RELAY_WEB_CLIENT_DIR: ${RELAY_WEB_CLIENT_DIR:+/web-client}
    ports:
      - "${RELAY_BIND_ADDRESS:-0.0.0.0}:${RELAY_PUBLIC_PORT:-443}:8443/tcp"
      - "127.0.0.1:9643:8080/tcp"
    volumes:
      - relay-data:/data
      - ${RELAY_WEB_CLIENT_DIR:-relay-web-client}:/web-client:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  relay-data:
  relay-web-client:
