services:
  openbot:
    image: ${OPENBOT_IMAGE:-openbot-nc}:${OPENBOT_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - seccomp=./seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    volumes:
      - openbot-nc-data:/data

volumes:
  openbot-nc-data:
